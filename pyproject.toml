[project]
name = "utaipei-credit-audit"
version = "0.2.0"
description = "University of Taipei credit audit tool with fail-closed parsing and privacy-safe output."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0,<5",
  "fastapi>=0.115.0,<1",
  "httpx>=0.27.0,<1",
  "pdfplumber>=0.11.0,<1",
  "playwright>=1.48.0,<2",
  "pydantic>=2.8.0,<3",
  "python-multipart>=0.0.9,<1",
  "typer>=0.12.0,<1",
  "uvicorn[standard]>=0.30.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9",
  "pytest-asyncio>=0.24.0,<1",
  "ruff>=0.8.0,<1",
]

[project.scripts]
utaipei-credit-audit = "app.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/web/main.py" = ["B008"]
"app/cli.py" = ["B008"]
