[project]
name = "utaipei-credit-audit"
version = "0.1.0"
description = "University of Taipei credit audit tool with UTaipei read-only scraping and fallback upload mode."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pdfplumber>=0.11.0",
  "playwright>=1.48.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "typer>=0.12.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
utaipei-credit-audit = "app.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

