name: Deploy to Hugging Face Spaces

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Deploy to Sapphirejimmy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_SAPPHIREJIMMY }}
        run: |
          git remote add hf-sapphirejimmy https://Sapphirejimmy:${HF_TOKEN}@huggingface.co/spaces/Sapphirejimmy/Utaipei-credit-checker
          git push hf-sapphirejimmy main --force
