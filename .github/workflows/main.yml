name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Deploy to u11310019
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_U11310019 }}
        run: |
          git remote add hf-u11310019 https://u11310019:${HF_TOKEN}@huggingface.co/spaces/u11310019/Utaipei-credit-checker
          git push hf-u11310019 main --force

      - name: Deploy to Sapphirejimmy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_SAPPHIREJIMMY }}
        run: |
          git remote add hf-sapphirejimmy https://Sapphirejimmy:${HF_TOKEN}@huggingface.co/spaces/Sapphirejimmy/Utaipei-credit-checker
          git push hf-sapphirejimmy main --force
