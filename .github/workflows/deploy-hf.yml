name: Test and deploy to Hugging Face

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
      - name: Compile Python files
        run: python -m compileall -q app
      - name: Docker build
        run: docker build -t utaipei-credit-audit .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Hugging Face secrets
        id: hf
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          HF_TOKEN_CLEAN="$(printf '%s' "$HF_TOKEN" | tr -d '\r\n')"
          HF_SPACE_REPO_CLEAN="$(printf '%s' "$HF_SPACE_REPO" | tr -d '\r\n')"
          if [ -n "$HF_TOKEN_CLEAN" ] && [ -n "$HF_SPACE_REPO_CLEAN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "HF_TOKEN or HF_SPACE_REPO is not configured; skipping Hugging Face deploy."
          fi
      - name: Validate Hugging Face token
        if: steps.hf.outputs.configured == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          HF_TOKEN_CLEAN="$(printf '%s' "$HF_TOKEN" | tr -d '\r\n')"
          echo "::add-mask::${HF_TOKEN_CLEAN}"
          curl --fail --silent --show-error --output /dev/null \
            --header "Authorization: Bearer ${HF_TOKEN_CLEAN}" \
            https://huggingface.co/api/whoami-v2
      - name: Push to Hugging Face Space
        if: steps.hf.outputs.configured == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          export HF_TOKEN_CLEAN="$(printf '%s' "$HF_TOKEN" | tr -d '\r\n')"
          HF_SPACE_REPO_CLEAN="$(printf '%s' "$HF_SPACE_REPO" | tr -d '\r\n')"
          echo "::add-mask::${HF_TOKEN_CLEAN}"
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git remote add hf "https://huggingface.co/spaces/${HF_SPACE_REPO_CLEAN}"
          ASKPASS_SCRIPT="$(mktemp)"
          trap 'rm -f "$ASKPASS_SCRIPT"' EXIT
          cat > "$ASKPASS_SCRIPT" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' user ;;
            *Password*) printf '%s\n' "$HF_TOKEN_CLEAN" ;;
          esac
          SH
          chmod 700 "$ASKPASS_SCRIPT"
          GIT_ASKPASS="$ASKPASS_SCRIPT" GIT_TERMINAL_PROMPT=0 git push hf HEAD:main
