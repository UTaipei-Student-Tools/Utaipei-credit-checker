[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utaipei-streamlit-bootstrap"
version = "0.2.0"
description = "Fail-closed startup bootstrap for the UTaipei Streamlit PWA shell and service worker"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
py-modules = ["sitecustomize"]

[tool.setuptools.packages.find]
where = ["."]
include = ["utaipei_pwa_bootstrap*"]
